name: Update data.json from CSV

on:
  push:
    paths:
      - "listings_investment_scored.csv"   # triggers only when CSV changes
      - "feature_matrix.csv"
  workflow_dispatch:                        # also allows manual trigger from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write                       # needed to commit data.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run generator script
        run: python generate_data.py

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: auto-update data.json [skip ci]"
          git push
